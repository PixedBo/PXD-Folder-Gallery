MOD_FOLDER_GALLERY_FIELD_THUMB_W_DESC="Generated thumbnail width."
MOD_FOLDER_GALLERY_FIELD_THUMB_H_LABEL="Thumbnail height (px)"
MOD_FOLDER_GALLERY_FIELD_THUMB_H_DESC="Generated thumbnail height."
MOD_FOLDER_GALLERY_FIELD_PER_PAGE_LABEL="Images per page"
MOD_FOLDER_GALLERY_FIELD_PER_PAGE_DESC="How many images load at once. Lower values keep large folders fast."
MOD_FOLDER_GALLERY_FIELD_SHOW_COUNTS_LABEL="Show image counts"
MOD_FOLDER_GALLERY_FIELD_SHOW_COUNTS_DESC="Shows the number of images in each folder. Off by default because it scans every sub-folder."
MOD_FOLDER_GALLERY_FIELD_CACHE_DIR_LABEL="Thumbnail cache folder"
MOD_FOLDER_GALLERY_FIELD_CACHE_DIR_DESC="Writable, web-accessible path (relative to the site root) where cached thumbnails are stored."

