; mod_folder_gallery - English (en-GB)

MOD_FOLDER_GALLERY="Folder Gallery"
MOD_FOLDER_GALLERY_XML_DESCRIPTION="Browses a folder as categories/sub-folders and shows images as a lazy-loaded grid with a lightbox. Built for large archives: one level is scanned at a time and thumbnails are cached."

MOD_FOLDER_GALLERY_FIELD_BASE_FOLDER_LABEL="Base folder"
MOD_FOLDER_GALLERY_FIELD_BASE_FOLDER_DESC="Path relative to the site root, e.g. images/gallery. Must be inside the site root and web-accessible."
MOD_FOLDER_GALLERY_FIELD_COLUMNS_LABEL="Columns"
MOD_FOLDER_GALLERY_FIELD_COLUMNS_DESC="Number of columns in the folder and image grids."
MOD_FOLDER_GALLERY_FIELD_FRAMEWORK_LABEL="Layout style"
MOD_FOLDER_GALLERY_FIELD_FRAMEWORK_DESC="Default uses the module's own styling and lightbox. UIkit 3 uses your theme's UIkit classes and lightbox (for YOOtheme / UIkit sites) so no extra assets need to load."
MOD_FOLDER_GALLERY_FRAMEWORK_DEFAULT="Default"
MOD_FOLDER_GALLERY_FRAMEWORK_UIKIT="UIkit 3"
MOD_FOLDER_GALLERY_FIELD_CROP_LABEL="Thumbnail mode"
MOD_FOLDER_GALLERY_FIELD_CROP_DESC="Cover crops to a square cell; Contain fits the whole image inside the cell."
MOD_FOLDER_GALLERY_CROP_COVER="Cover (crop)"
MOD_FOLDER_GALLERY_CROP_CONTAIN="Contain (fit)"
